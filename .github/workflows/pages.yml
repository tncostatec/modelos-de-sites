name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gera o modelo multipágina (advocacia)
        run: python modelos/advocacia/build.py
      - name: Monta a pasta publicada (galeria + modelos + capturas)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/assets
          cp -r modelos _site/modelos
          cp -r docs _site/docs
          rm -rf _site/modelos/advocacia/src
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
