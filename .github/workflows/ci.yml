name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q

  modelos:
    name: modelos · QA de layout, a11y e SEO (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0
      - run: python -m playwright install --with-deps chromium
      - name: Gera o modelo multipágina (advocacia)
        run: python modelos/advocacia/build.py
      - name: QA em 390 e 1440 px, console limpo, itens de a11y/SEO
        run: python tools/qa.py --sem-capturas
