# Subida local ou numa VPS atrás de um proxy reverso (Nginx/Traefik) que faça TLS.
# O contêiner roda com rootfs somente leitura: só `dados/` (SQLite) e /tmp são graváveis.
services:
  api:
    build: .
    image: modelos-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_PATH: /app/dados/modelos.sqlite3
    volumes:
      - ./dados:/app/dados
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100
